[project]
name = "ma114tsdb-api"
version = "1.0.0"
description = "ma114tsdb API - Web API for observability and runtime control"
requires-python = ">=3.11"
dependencies = [
    "faststream>=0.3.0",
    "prometheus-client>=0.18.0",
    "structlog>=23.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ma114tsdb-api = "ma114tsdb_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
