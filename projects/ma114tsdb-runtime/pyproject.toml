[project]
name = "ma114tsdb-runtime"
version = "1.0.0"
description = "ma114tsdb Pipeline Runtime - Time-series data acquisition system"
requires-python = ">=3.11"
dependencies = [
    "kombu>=5.3.0",
    "msgpack>=1.0.0",
    "prometheus-client>=0.18.0",
    "structlog>=23.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
ma114tsdb = "ma114tsdb_runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
